<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinema Pop – Conte seu filme favorito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="logo"><img src="logo.png" alt="elo – Agência de Marketing"></div>

  <header class="hero">
    <svg class="pow" aria-hidden="true" width="92" height="92" viewBox="0 0 100 100"><polygon points="50,2 61,28 90,15 74,42 98,58 68,62 72,92 50,72 28,92 32,62 2,58 26,42 10,15 39,28" fill="#FF3B30" stroke="#000" stroke-width="4" stroke-linejoin="round"/><text x="50" y="58" text-anchor="middle" font-family="Bangers,sans-serif" font-size="24" fill="#FFD500" stroke="#000" stroke-width="1.5">POW!</text></svg>
    <div class="tag">Revista ÉTUDO</div>
    <h1>Sobre filmes!</h1>
    <p>Qual é o SEU filme favorito? Conta tudo pra gente!</p>
  </header>

  <form id="form" class="card" novalidate>
    <div class="credit">
      <span>Desenvolvido por Pablo Bastos</span>
      <div class="social">
        <a href="https://www.instagram.com/pablobastos__" target="_blank" rel="noopener" aria-label="Instagram do Pablo Bastos"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1.3" fill="currentColor"/></svg></a>
        <a href="https://www.linkedin.com/in/bastospablo" target="_blank" rel="noopener" aria-label="LinkedIn do Pablo Bastos"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg></a>
        <a href="https://github.com/PabloBastos" target="_blank" rel="noopener" aria-label="GitHub do Pablo Bastos"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></a>
      </div>
    </div>
    <div class="f"><label for="nome">SEU NOME</label>
      <input id="nome" name="nome" type="text" maxlength="80" required autocomplete="given-name" placeholder="Como você se chama?" style="background:#FFF7B0"></div>
    <div class="row">
      <div class="f" style="width:100px"><label for="idade">IDADE</label>
        <input id="idade" name="idade" type="number" inputmode="numeric" min="1" max="120" required placeholder="00" style="background:#BDEBFF"></div>
      <div class="f" style="flex:1"><label for="curso">CURSO</label>
        <input id="curso" name="curso" type="text" maxlength="80" required placeholder="Ex.: Jornalismo" style="background:#FFC2DF"></div>
    </div>
    <div class="f"><label for="filme">FILME FAVORITO</label>
      <input id="filme" name="filme" type="text" maxlength="120" required placeholder="O título do filme da sua vida" style="background:#FFF7B0"></div>
    <div class="f"><label for="descricao">POR QUE VOCÊ AMA ESSE FILME?</label>
      <textarea id="descricao" name="descricao" rows="5" maxlength="1000" required placeholder="Fala da cena, do personagem, da emoção..." style="background:#BDEBFF"></textarea></div>
    <p id="erro" class="msg err hidden" role="alert"></p>
    <button id="enviar" class="btn" type="submit">ENVIAR!</button>
  </form>

  <section id="ok" class="card ok hidden" aria-live="polite">
    <h2>VALEU!</h2>
    <p class="msg">Sua resposta foi enviada. Que filme bom!</p>
    <button id="outra" class="btn" type="button" style="width:100%">ENVIAR OUTRA</button>
  </section>
</main>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const erro = $('erro'); erro.classList.add('hidden');
  const d = {nome: $('nome').value.trim(), idade: parseInt($('idade').value, 10), curso: $('curso').value.trim(), filme: $('filme').value.trim(), descricao: $('descricao').value.trim()};
  if (!d.nome || !d.curso || !d.filme || !d.descricao || !(d.idade >= 1 && d.idade <= 120)) {
    erro.textContent = 'Preencha todos os campos, ok?'; erro.classList.remove('hidden'); return;
  }
  $('enviar').disabled = true; $('enviar').textContent = 'ENVIANDO...';
  try {
    await enviarResposta(d);
    $('form').classList.add('hidden'); $('ok').classList.remove('hidden'); $('form').reset();
  } catch (err) {
    erro.textContent = 'Ops, não deu pra enviar. Tente de novo!'; erro.classList.remove('hidden');
  } finally { $('enviar').disabled = false; $('enviar').textContent = 'ENVIAR!'; }
});
$('outra').addEventListener('click', () => { $('ok').classList.add('hidden'); $('form').classList.remove('hidden'); $('nome').focus(); });
</script>
</body>
</html>
